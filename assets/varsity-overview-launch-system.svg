<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">From another landing page to a repeatable launch system</title><desc id="desc">One-off page work becomes shared components, approval and quality checks that help teams launch consistent program pages faster while protecting quality, learner clarity and partner trust.</desc><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#f4eee7"/></linearGradient><linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34332f"/><stop offset="1" stop-color="#22231f"/></linearGradient><filter id="s" x="-30%" y="-25%" width="160%" height="175%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#443220" flood-opacity=".08"/></filter></defs>
