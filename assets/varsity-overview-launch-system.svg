<text x="535" y="135" font-size="12" font-weight="700" letter-spacing="2" fill="#c34b1b">TO / THE REAL OPPORTUNITY</text><text x="535" y="187" font-size="39" font-weight="600" letter-spacing="-1.4">Create a repeatable</text><text x="535" y="235" font-size="39" font-weight="600" letter-spacing="-1.4">launch system.</text><text x="535" y="273" font-size="17" fill="#726e66">Help teams ship approved program pages faster.</text>
