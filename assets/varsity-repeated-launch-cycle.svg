<svg width="1440" height="620" viewBox="0 0 1440 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .f { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: 2.2px; fill: #df4b13; }
    .num { font-size: 19px; font-weight: 700; letter-spacing: 1.6px; fill: #df4b13; }
    .title { font-size: 27px; font-weight: 650; fill: #242424; letter-spacing: -0.4px; }
    .item { font-size: 21px; font-weight: 400; fill: #6b6b6b; }
    .loop { font-size: 22px; font-weight: 600; fill: #242424; }
    .statnum { font-size: 46px; font-weight: 700; fill: #242424; letter-spacing: -1.4px; }
    .statlbl { font-size: 21px; font-weight: 400; fill: #747474; }
    .box { fill: #ffffff; stroke: #dedede; stroke-width: 1.5; }
  </style>

  <g class="f">
    <!-- step boxes -->
    <g>
      <rect class="box" x="66" y="46" width="236" height="268" rx="10"/>
      <text class="num" x="94" y="90">01</text>
      <text class="title" x="94" y="132">Structure</text>
      <line x1="94" y1="156" x2="274" y2="156" stroke="#ececec" stroke-width="1.5"/>
      <text class="item" x="94" y="192">Page structure</text>
      <text class="item" x="94" y="226">Section order</text>
    </g>
    <g>
      <rect class="box" x="334" y="46" width="236" height="268" rx="10"/>
      <text class="num" x="362" y="90">02</text>
      <text class="title" x="362" y="132">Program story</text>
      <line x1="362" y1="156" x2="542" y2="156" stroke="#ececec" stroke-width="1.5"/>
      <text class="item" x="362" y="192">Curriculum layout</text>
      <text class="item" x="362" y="226">Faculty and proof</text>
      <text class="item" x="362" y="260">Imagery</text>
    </g>
    <g>
      <rect class="box" x="602" y="46" width="236" height="268" rx="10"/>
      <text class="num" x="630" y="90">03</text>
      <text class="title" x="630" y="132">Lead capture</text>
      <line x1="630" y1="156" x2="810" y2="156" stroke="#ececec" stroke-width="1.5"/>
      <text class="item" x="630" y="192">Lead forms</text>
      <text class="item" x="630" y="226">Callback states</text>
    </g>
    <g>
      <rect class="box" x="870" y="46" width="236" height="268" rx="10"/>
      <text class="num" x="898" y="90">04</text>
      <text class="title" x="898" y="132">Launch checks</text>
      <line x1="898" y1="156" x2="1078" y2="156" stroke="#ececec" stroke-width="1.5"/>
      <text class="item" x="898" y="192">Metadata</text>
      <text class="item" x="898" y="226">SEO checks</text>
      <text class="item" x="898" y="260">CTA checks</text>
    </g>
    <g>
      <rect class="box" x="1138" y="46" width="236" height="268" rx="10"/>
      <text class="num" x="1166" y="90">05</text>
      <text class="title" x="1166" y="132">Final review</text>
      <line x1="1166" y1="156" x2="1346" y2="156" stroke="#ececec" stroke-width="1.5"/>
      <text class="item" x="1166" y="192">Manual QA pass</text>
      <text class="item" x="1166" y="226">Publish</text>
    </g>

    <!-- chevrons -->
    <g stroke="#c9c9c9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M312 172 l10 8 -10 8"/>
      <path d="M580 172 l10 8 -10 8"/>
      <path d="M848 172 l10 8 -10 8"/>
      <path d="M1116 172 l10 8 -10 8"/>
    </g>

    <!-- return loop -->
    <path d="M1256 314 V 398 Q1256 424 1230 424 H 210 Q184 424 184 398 V 334"
          fill="none" stroke="#df4b13" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M177 342 l7 -12 7 12" fill="none" stroke="#df4b13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="556" y="406" width="330" height="36" fill="#ffffff"/>
    <text class="loop" x="721" y="432" text-anchor="middle">Repeat for the next program</text>

    <!-- bottom stats -->
    <line x1="66" y1="492" x2="1374" y2="492" stroke="#dedede" stroke-width="1.5"/>
    <text class="statnum" x="66" y="558">3 to 4 days</text>
    <text class="statlbl" x="66" y="594">per launch, including approvals</text>
    <text class="statnum" x="760" y="558">6 programs</text>
    <text class="statlbl" x="760" y="594">the same five jobs, every time</text>
  </g>
</svg>
