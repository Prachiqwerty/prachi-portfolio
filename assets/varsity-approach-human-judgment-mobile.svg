<svg width="1440" height="680" viewBox="0 0 1440 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .f { font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: 2.4px; fill: #8a8a8a; }
    .h { font-size: 36px; font-weight: 650; fill: #242424; letter-spacing: -0.6px; }
    .row { font-size: 23px; font-weight: 500; fill: #3d3d3d; }
    .gate { font-size: 27px; font-weight: 650; fill: #242424; letter-spacing: -0.3px; }
    .gatesub { font-size: 19px; font-weight: 400; fill: #8a8a8a; }
    .foot { font-size: 24px; font-weight: 600; fill: #242424; }
  </style>

  <g class="f">
    <text class="eyebrow" x="66" y="52">WORK THAT NEEDED PEOPLE</text>
    <text class="h" x="66" y="108">Work that needed human judgment</text>

    <!-- input rows -->
    <g>
      <line x1="66" y1="176" x2="520" y2="176" stroke="#dedede" stroke-width="1.5"/>
      <circle cx="78" cy="212" r="4" fill="#df4b13"/>
      <text class="row" x="102" y="220">Partner claims</text>
      <line x1="66" y1="248" x2="520" y2="248" stroke="#ececec" stroke-width="1.5"/>
      <circle cx="78" cy="284" r="4" fill="#df4b13"/>
      <text class="row" x="102" y="292">Pricing</text>
      <line x1="66" y1="320" x2="520" y2="320" stroke="#ececec" stroke-width="1.5"/>
      <circle cx="78" cy="356" r="4" fill="#df4b13"/>
      <text class="row" x="102" y="364">Program positioning</text>
      <line x1="66" y1="392" x2="520" y2="392" stroke="#ececec" stroke-width="1.5"/>
      <circle cx="78" cy="428" r="4" fill="#df4b13"/>
      <text class="row" x="102" y="436">Institution representation</text>
      <line x1="66" y1="464" x2="520" y2="464" stroke="#ececec" stroke-width="1.5"/>
      <circle cx="78" cy="500" r="4" fill="#df4b13"/>
      <text class="row" x="102" y="508">Learner promises</text>
      <line x1="66" y1="536" x2="520" y2="536" stroke="#dedede" stroke-width="1.5"/>
    </g>

    <!-- converging lines -->
    <g fill="none" stroke="#d6d6d6" stroke-width="1.5">
      <path d="M520 212 C 600 212, 620 292, 700 356"/>
      <path d="M520 284 C 600 284, 630 320, 700 356"/>
      <path d="M520 356 H 700"/>
      <path d="M520 428 C 600 428, 630 392, 700 356"/>
      <path d="M520 500 C 600 500, 620 420, 700 356"/>
    </g>

    <!-- gate -->
    <rect x="700" y="298" width="330" height="116" rx="10" fill="#fff1e9" stroke="#df4b13" stroke-width="1.5"/>
    <text class="gate" x="730" y="346">Human review</text>
    <text class="gatesub" x="730" y="378">Accountable judgment, every time</text>

    <path d="M1030 356 H 1090" stroke="#c9c9c9" stroke-width="2"/>
    <path d="M1083 349 l9 7 -9 7" fill="none" stroke="#c9c9c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1104" y="298" width="270" height="116" rx="10" fill="#ffffff" stroke="#dedede" stroke-width="1.5"/>
    <text class="gate" x="1134" y="346">Approved</text>
    <text class="gatesub" x="1134" y="378">Cleared to ship</text>

    <line x1="66" y1="600" x2="1374" y2="600" stroke="#dedede" stroke-width="1.5"/>
    <text class="foot" x="66" y="648">Automation prepares the work. People approve what ships.</text>
  </g>
</svg>
